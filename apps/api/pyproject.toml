[project]
name = "verdict-api"
version = "0.1.0"
description = "Verdict FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "PyJWT>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "pymongo>=4.10,<5.0",
  "python-multipart>=0.0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "cryptography>=44,<46",
  "pwdlib[argon2]>=0.2,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
